[build]
  publish = "."

[[redirects]]
  from = "/.env*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/server.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package*.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/api/site"
  to = "/.netlify/functions/site"
  status = 200

[[redirects]]
  from = "/api/login"
  to = "/.netlify/functions/login"
  status = 200

[[redirects]]
  from = "/api/session"
  to = "/.netlify/functions/session"
  status = 200

[[redirects]]
  from = "/api/logout"
  to = "/.netlify/functions/logout"
  status = 200

[[redirects]]
  from = "/api/tools/upload"
  to = "/.netlify/functions/tools-upload"
  status = 200

[[redirects]]
  from = "/api/firebase/status"
  to = "/.netlify/functions/firebase-status"
  status = 200

[[redirects]]
  from = "/api/firebase/sync"
  to = "/.netlify/functions/firebase-sync"
  status = 200

[[redirects]]
  from = "/api/blob"
  to = "/.netlify/functions/blob"
  status = 200

[[headers]]
  for = "/data/site.json"
  [headers.values]
    Cache-Control = "no-store"
